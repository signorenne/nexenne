[changelog]
header = """
#+TITLE: Changelog
#+OPTIONS: toc:nil num:nil ^:nil
#+STARTUP: showall

All notable user-facing changes are generated from Conventional Commits.

"""
body = """
{% if version %}* {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}* Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
** {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}={{ commit.scope }}=: {% endif %}{% if commit.breaking %}BREAKING: {% endif %}{{ commit.message | upper_first }} (={{ commit.id | truncate(length=7, end="") }}=)
{% endfor %}
{% endfor %}
"""
trim = true
footer = """

# Generated by git-cliff. Do not edit release sections by hand.
"""
# No default output: prepare_release.sh prepends to CHANGELOG.org with --prepend
# and the release workflows write notes with an explicit --output. git-cliff
# errors when a config output points at the same file as a --prepend target.

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
ignore_tags = "^v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^style", group = "Style" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Maintenance" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
no_increment_regex = "^(build|chore|ci|docs|refactor|style|test)"

[remote.github]
owner = "signorenne"
repo = "nexenne"
